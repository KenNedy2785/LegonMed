<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LegonMed – Africa's Next-Generation Healthcare Education Ecosystem. Medical school, pharmacology institute, AI tutor, clinical simulator and more in one platform." />
    <meta name="keywords" content="medical education, Africa, healthcare, LegonMed, UGMS, pharmacology, clinical simulator, CPD, nursing, Ghana" />
    <meta name="author" content="Prof. Kennedy Kwami Edem Kukuia" />

    <!-- Open Graph (WhatsApp, Facebook previews) -->
    <meta property="og:title" content="LegonMed – Africa's Healthcare Education Ecosystem" />
    <meta property="og:description" content="Medical school. Pharmacology institute. AI tutor. Clinical simulator. All in one platform – built in Africa, for the world." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://legonmed.edu.gh" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LegonMed – Africa's Healthcare Education Ecosystem" />
    <meta name="twitter:description" content="Medical school. Pharmacology institute. AI tutor. Clinical simulator. All in one platform." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>LegonMed – Africa's Healthcare Education Ecosystem</title>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #001a5e; }
      #root { min-height: 100vh; }
      /* Loading screen shown before React mounts */
      #splash {
        position: fixed; inset: 0;
        background: linear-gradient(135deg, #001a5e, #003087);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.6s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 20px; }
      #splash h1 {
        font-family: Georgia, serif; font-size: 36px; font-weight: 900;
        color: #fff; letter-spacing: -1px;
      }
      #splash h1 span { color: #C8A951; }
      #splash p {
        font-family: Arial, sans-serif; font-size: 13px;
        color: rgba(255,255,255,0.6); margin-top: 10px;
        letter-spacing: 2px; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <!-- Splash screen (disappears once React loads) -->
    <div id="splash">
      <img
        src="https://upload.wikimedia.org/wikipedia/en/thumb/9/9e/University_of_Ghana_coat_of_arms.svg/200px-University_of_Ghana_coat_of_arms.svg.png"
        alt="University of Ghana"
        onerror="this.style.display='none'"
      />
      <h1>Legon<span>Med</span></h1>
      <p>UGMS Collaboration · Loading…</p>
    </div>

    <div id="root"></div>

    <script>
      // Hide splash once React mounts
      window.addEventListener('load', () => {
        setTimeout(() => {
          const s = document.getElementById('splash');
          if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 700); }
        }, 800);
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
